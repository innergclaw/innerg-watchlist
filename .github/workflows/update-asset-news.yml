name: Update asset news
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: asset-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test news parsing
        run: python -m unittest discover -s scripts -p 'test_asset_news.py'
      - name: Refresh selected feeds
        id: news
        continue-on-error: true
        run: python scripts/update_asset_news.py
      - name: Save news and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/asset-news.json
          git diff --staged --quiet || git commit -m 'Refresh asset news'
          git pull --rebase origin main
          git push
      - name: Request existing GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Report total source outage
        if: steps.news.outcome == 'failure'
        run: exit 1
