name: Update asset news
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: read
concurrency:
  group: asset-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_asset_news.py'
      - name: Refresh and publish protected news
        env:
          RESEARCH_PUBLISH_KEY: ${{ secrets.RESEARCH_PUBLISH_KEY }}
        run: python scripts/sync_private_news.py
