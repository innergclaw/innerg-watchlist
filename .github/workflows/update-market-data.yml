name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "7,37 10-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market snapshot
        run: python scripts/update_market_data.py
      - name: Check history windows
        run: python scripts/test_market_history.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/watchlist.json; then
            echo "No market data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          git commit -m "Update market snapshot"
          git push
