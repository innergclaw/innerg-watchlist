name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    # UTC crons (timezone key removed, unverified support). Covers EDT (UTC-4) and EST (UTC-5).
    - cron: "37 13,14 * * 1-5"
    - cron: "7,37 14-20 * * 1-5"
    - cron: "20 20,21 * * 1-5"


permissions:
  contents: write
  actions: write

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build market snapshot
        run: python scripts/update_market_data.py
      - name: Install closing graphic dependencies
        if: github.event.schedule == '20 20,21 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install pillow
      - name: Build closing report and graphic
        if: github.event.schedule == '20 20,21 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_closing_report.py
      - name: Check history windows
        run: python scripts/test_market_history.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/watchlist.json data/closing-report.json assets/innerg-closing-bell.png; then
            echo "No market data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json data/closing-report.json assets/innerg-closing-bell.png
          git commit -m "Update market snapshot and closing report"
          git push
      - name: Publish refreshed charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
